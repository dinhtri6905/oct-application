services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oct
      POSTGRES_USER: oct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oct_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oct -d oct"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: oct
      DB_NAME: oct
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oct_local_password}
      DATA_DIR: /data/images
      MODEL_PATH: /model/maxvit_oct.keras
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./model/maxvit_oct.keras:/model/maxvit_oct.keras:ro
      - image_data:/data/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 180s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  image_data:
